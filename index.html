<style>
/* One column, one screen at a time: a top bar with two tabs, then lists, study, recall, result.
   The large mono length number is the only bold element; everything around it stays quiet. */
:root {
  --bg: #EDF0F6;
  --surface: #FFFFFF;
  --surface-2: #E2E8F3;
  --ink: #131A2E;
  --muted: #56627F;
  --line: #C9D2E4;
  --accent: #2543F5;
  --on-accent: #FFFFFF;
  --mark: #FFD84A;
  --on-mark: #2B2300;
  --good: #0F7A56;
  --bad: #B8362B;
  --f-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1120; --surface: #141B30; --surface-2: #1C2542; --ink: #E8EDFB; --muted: #97A2C3;
    --line: #29345A; --accent: #8EA2FF; --on-accent: #0C1120; --good: #4FD6A2; --bad: #FF8E7E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1120; --surface: #141B30; --surface-2: #1C2542; --ink: #E8EDFB; --muted: #97A2C3;
  --line: #29345A; --accent: #8EA2FF; --on-accent: #0C1120; --good: #4FD6A2; --bad: #FF8E7E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 1rem/1.5 var(--f-body);
  padding-inline: 1rem; padding-block: 1rem 7rem;
}
.wrap { max-width: 46rem; margin-inline: auto; display: flex; flex-direction: column; gap: 1.5rem; }
h1, h2, h3, p { margin: 0; }
h1 { font: 800 clamp(1.7rem, 6vw, 2.3rem)/1.1 var(--f-display); text-wrap: balance; letter-spacing: -0.01em; }
h2 { font: 600 1.15rem/1.2 var(--f-display); }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.eyebrow { font: 600 .75rem/1 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: .75rem 1rem; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: .6rem; font: 800 1.25rem/1 var(--f-display); letter-spacing: -0.01em; color: var(--ink); }
.brand svg { width: 1.6rem; height: 1.6rem; color: var(--accent); }
.tabs { display: flex; gap: .2rem; background: var(--surface-2); border-radius: .7rem; padding: .2rem; }
.tab { border: 0; background: transparent; border-radius: .5rem; padding: .5rem .9rem; font-weight: 600; font-size: .9375rem; cursor: pointer; color: var(--muted); min-height: 2.5rem; }
.tab[aria-current="page"] { background: var(--surface); color: var(--ink); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 2.75rem; padding: .65rem 1.1rem; border-radius: .65rem; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-align: center; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.quiet { background: transparent; }
.btn.wide { width: 100%; }
.link { border: 0; background: none; padding: .25rem 0; font-weight: 600; color: var(--accent); cursor: pointer; min-height: 2.5rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: .9rem; padding: 1.1rem; display: flex; flex-direction: column; gap: .9rem; min-width: 0; }
.chip { display: inline-block; font: 600 .75rem/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; padding: .35rem .55rem; border-radius: .4rem; background: var(--surface-2); color: var(--muted); }
.row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: .75rem; }

.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
.big { font: 800 clamp(3.2rem, 15vw, 5rem)/1 var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.numline { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.actions .btn.primary { flex: 1 1 8rem; }

.starts { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .75rem; }
.start { text-align: left; align-items: flex-start; flex-direction: column; gap: .25rem; padding: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: .8rem; cursor: pointer; min-height: 5.5rem; }
.start strong { font: 600 1.1rem/1.2 var(--f-display); }
.start span { font-size: .875rem; color: var(--muted); }
.start:hover { border-color: var(--accent); }

.wgrid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: .5rem; }
.wgrid li { display: flex; align-items: baseline; gap: .5rem; padding: .6rem .7rem; background: var(--surface); border: 1px solid var(--line); border-radius: .55rem; min-width: 0; }
.wgrid .n { font: 400 .75rem/1 var(--f-mono); color: var(--muted); min-width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums; }
.wgrid .w { font: 500 1.05rem/1.2 var(--f-mono); overflow-wrap: anywhere; }
.ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: .5rem; }
.grp { display: flex; align-items: baseline; gap: .6rem; padding: .6rem .7rem; background: var(--surface); border: 1px solid var(--line); border-radius: .55rem; min-width: 0; }
.grp .gi { font: 400 .75rem/1 var(--f-mono); color: var(--muted); min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
.grp .gv { font: 500 1.35rem/1.2 var(--f-mono); letter-spacing: .28em; }
mark, .wgrid li.new { background: var(--mark); color: var(--on-mark); border-radius: .25rem; }
.wgrid li.new { border-color: transparent; }
.wgrid li.new .n { color: var(--on-mark); }
.grp mark { padding: 0 .08em; margin-inline: -.08em; }

.dock { position: fixed; inset-inline: 0; bottom: 0; padding: .75rem 1rem calc(.75rem + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); display: flex; justify-content: center; gap: .5rem; }
.dock .in { width: 100%; max-width: 46rem; display: flex; gap: .5rem; }
.dock .btn.primary { flex: 1; }

textarea { width: 100%; min-height: 13rem; resize: vertical; padding: .9rem; border-radius: .7rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 1.1rem/1.6 var(--f-mono); }
textarea::placeholder { color: var(--muted); }
.counter { font: 500 .875rem/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.warn { color: var(--bad); font-weight: 500; }

.verdict { display: flex; flex-direction: column; gap: .75rem; }
.verdict.ok .eyebrow { color: var(--good); }
.verdict.no .eyebrow { color: var(--bad); }
.pill { display: inline-block; align-self: flex-start; padding: .4rem .7rem; border-radius: 999px; background: var(--mark); color: var(--on-mark); font-weight: 600; font-size: .875rem; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: .7rem; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 600 .75rem/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
td.m { font-family: var(--f-mono); }
tr:last-child td { border-bottom: 0; }

.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 1rem; }
.foot { text-align: center; padding-top: .5rem; display: flex; flex-direction: column; align-items: center; gap: .5rem; }
.authrow { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: center; width: 100%; }
.authrow input { flex: 1 1 14rem; min-width: 0; min-height: 2.75rem; padding: .6rem .8rem; border-radius: .65rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 400 1rem var(--f-body); }
</style>

function rnd(n) { return Math.floor(Math.random() * n); }

function pickWord(items) {
  var used = new Set(items), L = items.length, N = BANK.length;
  var lo = Math.max(0, L - 30), hi = Math.min(N, L + 70);
  for (var k = 0; k < 20; k++) {
    var c = [];
    for (var i = lo; i < hi; i++) if (!used.has(BANK[i])) c.push(BANK[i]);
    if (c.length) return c[rnd(c.length)];
    var span = hi - lo;
    lo = Math.max(0, lo - span); hi = Math.min(N, hi + span);
  }
  for (var j = 0; j < N; j++) if (!used.has(BANK[j])) return BANK[j];
  return null;
}

  for (var t = 0; t < 80; t++) {

    if (n >= 2) {
      var a = +items[n - 2], b = +items[n - 1];
      if (a === b && b === d) continue;
      if (b - a === 1 && d - b === 1) continue;
      if (a - b === 1 && b - d === 1) continue;
    }
    return String(d);
  }

  var fresh = pool.split('').filter(function (ch) { return n >= 26 || !used.has(ch); });
  for (var t = 0; t < 80; t++) {
    var ch = fresh[rnd(fresh.length)], c = ch.toUpperCase().charCodeAt(0);
    if (Math.abs(c - prev) <= 1) continue;

var LS = 'recall-ladder-v1';

    '<div class="stack"><label for="answer" class="eyebrow">Your answer</label>' +
    '<textarea id="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"' + im + ' placeholder="Start typing"></textarea>' +
    '<div class="row"><span class="counter" id="count">Typed 0 of ' + fmt(n) + '</span><span class="small warn" id="msg"></span></div></div></div>';
}

function resultHTML(l) {
  var r = ui.result, c = CATS[l.cat];
  if (r.ok) {
    var next = l.complete ? '' : '<p class="muted">Next up: ' + fmt(l.items.length) + ' ' + c.unit + '. One new ' + (l.cat === 'words' ? 'word' : l.cat === 'numbers' ? 'digit' : 'letter') + ' is waiting at the end.</p>';
    return '<div class="verdict ok"><span class="eyebrow">Mastered</span>' +
      '<div class="numline"><span class="big">' + fmt(r.total) + '</span><span class="muted">' + c.unit + ' recalled in order</span></div>' +
      (r.newBest ? '<span class="pill">New best in ' + c.label + '</span>' : '') +
      (l.complete ? '<p class="muted">This list is complete. You can review it any time.</p>' : next) +
      '<div class="actions"><button class="btn primary" data-act="open" data-id="' + l.id + '">' + (l.complete ? 'Review the list' : 'Study length ' + fmt(l.items.length)) + '</button>' +
      '<button class="btn" data-act="home">Back to lists</button></div></div>';
  }
  var shown = r.misses.slice(0, 8), more = r.misses.length - shown.length;
  var rows = shown.map(function (m) {
    return '<tr><td>' + fmt(m.pos) + '</td><td class="m">' + esc(m.expected) + '</td><td class="m">' + (m.typed === null ? '<span class="muted">nothing</span>' : esc(m.typed)) + '</td></tr>';
  }).join('');
  var first = r.misses.length ? r.misses[0] : null;
  var line = first ? 'First miss at position ' + fmt(first.pos) + '. It was ' + esc(first.expected) + (first.typed === null ? ' and you stopped before it.' : ', you typed ' + esc(first.typed) + '.')
    : 'Everything was right, but you typed ' + fmt(r.extra) + ' extra ' + c.unit + ' at the end.';
  return '<div class="verdict no"><span class="eyebrow">Not yet</span>' +
    '<div class="numline"><span class="big" style="color:var(--ink)">' + fmt(r.right) + '<span class="muted" style="font-size:.5em"> / ' + fmt(r.total) + '</span></span><span class="muted">in the right place</span></div>' +
    '<p>' + line + '</p>' +
    (rows ? '<div class="tablewrap"><table><thead><tr><th>Position</th><th>It was</th><th>You typed</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '') +
    (more > 0 ? '<p class="small muted">and ' + fmt(more) + ' more in the same list</p>' : '') +
    (r.extra && rows ? '<p class="small muted">You also typed ' + fmt(r.extra) + ' extra at the end.</p>' : '') +
    '<p class="muted">The list stays the same. Study it again and try once more.</p>' +
    '<div class="actions"><button class="btn primary" data-act="open" data-id="' + l.id + '">Study the same list again</button>' +
    '<button class="btn" data-act="home">Back to lists</button></div></div>';
}

function scoreHTML() {
  var cards = Object.keys(CATS).map(function (k) {
    var b = state.bests[k], c = CATS[k];
    return '<article class="card"><div class="row"><h2>' + c.label + '</h2><span class="chip">Best</span></div>' +
      '<div class="numline"><span class="big">' + fmt(b.best) + '</span><span class="muted">' + c.unit + ' in order</span></div>' +
      '<p class="small muted">' + (b.best ? 'Set ' + when(b.at) + ' · ' : 'No score yet · ') + fmt(b.mastered) + ' perfect of ' + fmt(b.attempts) + ' attempt' + (b.attempts === 1 ? '' : 's') + '</p></article>';
  }).join('');
  return '<div class="stack" style="gap:1.5rem"><div class="stack"><h1>Scoreboard</h1>' +
    '<p class="muted">Your longest perfect recall in each category. Deleting a list never lowers a score.</p></div>' +
    '<div class="scores">' + cards + '</div></div>';
}

function render() {
  if (timer) { clearInterval(timer); timer = null; }
  var v = ui.view, s = $('#screen'), l = cur();
  if ((v === 'study' || v === 'recall' || v === 'result') && !l) { ui.view = v = 'home'; }
  $('#tab-home').setAttribute('aria-current', v === 'score' ? 'false' : 'page');
  $('#tab-score').setAttribute('aria-current', v === 'score' ? 'page' : 'false');
  setDock('');
  if (v === 'home') s.innerHTML = homeHTML();
  else if (v === 'score') s.innerHTML = scoreHTML();
  else if (v === 'study') {
    s.innerHTML = studyHTML(l);
    setDock('<button class="btn primary" data-act="recall">Hide the list and recall</button>');
    ui.start = Date.now(); tick(); timer = setInterval(tick, 1000);
  } else if (v === 'recall') {
    s.innerHTML = recallHTML(l);
    setDock('<button class="btn primary" data-act="check">Check my answer</button>');
    var a = $('#answer'); if (a) a.focus();
  } else if (v === 'result') s.innerHTML = resultHTML(l);
  foot();
}

function newList(cat) {
  state.counters[cat] += 1;
  var l = { id: 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: CATS[cat].label + ' ' + state.counters[cat], cat: cat, items: [], attempts: 0, mastered: 0, created: Date.now(), complete: false };
  l.items.push(nextItem(cat, []));
  state.lists.unshift(l);
  persist([l.id], [], true);
  go('study', { listId: l.id });
}
function check() {
  var l = cur(); if (!l) return;
  var a = $('#answer'), typed = parseAnswer(l.cat, a.value);
  if (!typed.length) { $('#msg').textContent = 'Type your answer first.'; return; }
  var g = grade(l.items, typed), b = state.bests[l.cat];
  l.attempts += 1; b.attempts += 1;
  var res = { ok: g.ok, right: g.right, total: g.total, misses: g.misses, extra: g.extra, newBest: false };
  if (g.ok) {
    l.mastered += 1; b.mastered += 1;
    if (g.total > b.best) { b.best = g.total; b.at = Date.now(); res.newBest = true; }
    if (l.items.length >= MAX) l.complete = true;
    else { var w = nextItem(l.cat, l.items); if (w) l.items.push(w); else l.complete = true; }
  }
  persist([l.id], [], true);
  go('result', { result: res });
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t) return;
  var act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
  if (act === 'home') { ui.confirmDel = null; go('home'); }
  else if (act === 'score') go('score');
  else if (act === 'new') newList(t.getAttribute('data-cat'));
  else if (act === 'open') go('study', { listId: id });
  else if (act === 'recall') go('recall');
  else if (act === 'check') check();
  else if (act === 'signin') { signingIn = true; authMsg = ''; foot(); var em = $('#email'); if (em) em.focus(); }
  else if (act === 'signout') { authMsg = ''; sb.auth.signOut(); }
  else if (act === 'askdel') { ui.confirmDel = id; render(); }
  else if (act === 'canceldel') { ui.confirmDel = null; render(); }
  else if (act === 'del') {
    state.lists = state.lists.filter(function (x) { return x.id !== id; });
    ui.confirmDel = null; persist([], [id], false); render();
  }
});
document.addEventListener('submit', function (e) {
  if (e.target.id !== 'authform') return;
  e.preventDefault();
  var email = $('#email').value.trim(); if (!email || !sb) return;
  authMsg = 'Sending the link…'; foot();
  sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: location.origin + location.pathname } }).then(function (r) {
    signingIn = false;
    authMsg = r.error ? 'Could not send the link: ' + r.error.message : 'Check your email and open the link to sign in.';
    foot();
  });
});
document.addEventListener('input', function (e) {
  if (e.target.id !== 'answer') return;
  var l = cur(); if (!l) return;
  var n = parseAnswer(l.cat, e.target.value).length;
  $('#count').textContent = 'Typed ' + fmt(n) + ' of ' + fmt(l.items.length);
  $('#msg').textContent = '';
});
document.addEventListener('keydown', function (e) {
  if (e.target.id === 'answer' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); check(); }
});

loadLocal();
render();
connect();
})();
</script>
